<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f1ee" />
    <title>Bougie Cakeria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@500;600&family=DM+Sans:wght@400;500&family=Playwrite+IT+Moderna:wght@200..400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home-screen">
      <!-- Edit this page copy directly; IDs are used only by the small interactive features. -->
      <div class="top-garnish" aria-hidden="true"><img src="assets/images/backgrounds/sliced-strawberry-rosette-transparent.png" alt=""></div>
      <div class="pore-layer" aria-hidden="true"></div>
      <div class="frosting-band frosting-band-one" aria-hidden="true"></div>
      <div class="frosting-band frosting-band-two" aria-hidden="true"></div>
      <section class="hero" aria-label="Cake studio home">
        <div class="hero-title">
          <p id="site-tagline" class="eyebrow">Cakes made to celebrate</p>
          <h1 id="site-name">Bougie Cakes</h1>
        </div>
        <div class="hero-description">
          <p id="site-intro" class="intro">A considered little home for beautiful, custom cakes.</p>
        </div>
      </section>
      <footer class="site-footer">
        <p id="business-location">Bougie Cakes · OKC</p>
        <a id="business-email" href="mailto:hello@example.com">hello@example.com</a>
      </footer>
    </main>

    <dialog id="order-overlay" class="order-overlay" aria-labelledby="order-title">
      <div class="order">
        <button class="close-order" type="button" aria-label="Close order form">×</button>
        <p class="section-kicker">Let’s make something lovely</p>
        <h2 id="order-title">Tell me about your celebration.</h2>
        <form id="order-form">
          <label>Name<input required name="name" autocomplete="name" /></label>
          <label>Email<input required type="email" name="email" autocomplete="email" /></label>
          <label>Event date<input required type="date" name="date" /></label>
          <label>Tell me what you’re dreaming of<textarea required name="details" rows="4" placeholder="Servings, flavors, colors, occasion…"></textarea></label>
          <button type="submit">Send inquiry <span>↗</span></button>
          <p class="form-note" id="form-note" role="status"></p>
        </form>
      </div>
    </dialog>

    <!-- Floating appearance editor: controls stay small so the site remains visible. -->
    <nav class="editor" aria-label="Site appearance controls">
      <div class="editor-options" aria-live="polite"></div>
      <button class="editor-bauble" type="button" aria-expanded="false" aria-label="Open appearance settings">✦</button>
      <section class="editor-panel" aria-live="polite"></section>
    </nav>
    <nav id="text-toolbar" class="text-toolbar" aria-label="Text editing controls" hidden>
      <button type="button" data-text-action="align-left" aria-label="Align left">☰</button>
      <button type="button" data-text-action="align-center" aria-label="Align center">≡</button>
      <button type="button" data-text-action="align-right" aria-label="Align right">☷</button>
      <button type="button" data-text-action="font-down" aria-label="Decrease font size">A−</button>
      <button type="button" data-text-action="font-up" aria-label="Increase font size">A+</button>
      <button type="button" data-text-action="weight" aria-label="Toggle bold">B</button>
      <button type="button" data-text-action="done">Done</button>
    </nav>

    <script src="script.js"></script>
    <script src="navigation.js"></script>
  </body>
</html>
